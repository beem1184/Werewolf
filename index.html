<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>มนุษย์หมาป่า</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{color-scheme:light;--bg:#EEEAF6;--surface:#F9F7FD;--fg:#1B1530;--muted:#5E5779;--line:#CFC8E2;--accent:#B7791F;--accent-fg:#FFFFFF;--accent-soft:#F3E3C3;--good:#15764B;--bad:#B3261E;--wolf:#B3261E;--vill:#285A9C;--third:#6A3FA8;--warn:#9A6200;--font-display:"Kanit","Noto Sans Thai",system-ui,sans-serif;--font-body:"Noto Sans Thai","Kanit",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E0B1C;--surface:#1A1632;--fg:#EEEAF8;--muted:#A09ABD;--line:#312B52;--accent:#F0B955;--accent-fg:#1A1203;--accent-soft:#3A2D14;--good:#4CC38A;--bad:#FF8A80;--wolf:#FF7A80;--vill:#7FB0F0;--third:#B99CF2;--warn:#F0B955;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E0B1C;--surface:#1A1632;--fg:#EEEAF8;--muted:#A09ABD;--line:#312B52;--accent:#F0B955;--accent-fg:#1A1203;--accent-soft:#3A2D14;--good:#4CC38A;--bad:#FF8A80;--wolf:#FF7A80;--vill:#7FB0F0;--third:#B99CF2;--warn:#F0B955;color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
#app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.25}h3{font-size:19px}p{margin:0}
.brand .mark{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.2}
.brand p{color:var(--muted);font-size:14px;margin-top:6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.center{text-align:center;align-items:center}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}
button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:46px;padding:9px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-family:var(--font-display);font-size:16px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn.block{width:100%}.btn.ghost{background:transparent}
.btn.round{width:40px;min-height:40px;padding:0;border-radius:50%;font-size:20px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--vill);outline-offset:2px}
input[type=text],input:not([type]),input.code,select{min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;width:100%}
input.code{width:130px;text-transform:uppercase;letter-spacing:.2em;text-align:center;font-family:var(--font-display);font-size:20px}
select{width:auto}input[type=checkbox]{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;font-size:14px}
.chip.pick[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.stage{font-family:var(--font-display);font-size:22px;font-weight:600}
.who{font-family:var(--font-display);font-size:36px;font-weight:700;overflow-wrap:anywhere}
.clock{font-family:var(--font-display);font-weight:600;font-size:48px;font-variant-numeric:tabular-nums}.clock.low{color:var(--bad)}
.roomcode{font-family:var(--font-display);font-size:48px;font-weight:700;letter-spacing:.2em}
.val{display:inline-block;min-width:2.2em;text-align:center;border-radius:8px;padding:0 6px;font-family:var(--font-display);font-weight:600;font-size:13px}
.val.pos{background:var(--vill);color:#fff}.val.neg{background:var(--wolf);color:#fff}.val.zero{background:var(--line);color:var(--fg)}
.q{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--accent-soft);color:var(--warn);font-size:12px;font-weight:700}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.rrow.on{background:var(--accent-soft);margin:0 -8px;padding-inline:8px;border-radius:10px}
.rinfo{display:flex;gap:10px;min-width:0}.rinfo .e{font-size:26px}.rt{font-weight:600}.rd{font-size:12.5px;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:8px;flex:none}.stepper .num{min-width:1.6ch;text-align:center;font-family:var(--font-display);font-size:20px}
.meter .bar{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--wolf),var(--line) 50%,var(--vill))}
.meter .bar b{position:absolute;top:-4px;width:6px;height:22px;border-radius:3px;background:var(--fg);transform:translateX(-50%)}
.meter .bl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.bsum{font-size:17px;margin-top:6px}.bsum strong{font-family:var(--font-display);font-size:26px}.bsum.ok{color:var(--good)}.bsum.warn{color:var(--warn)}.bsum.bad{color:var(--bad)}
.warnbox{background:var(--accent-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:14px}
.errbox{background:var(--accent-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:14px}
.okbox{color:var(--good);font-size:14px}
.rcard{border:2px solid var(--vill);border-radius:18px;padding:18px;background:var(--surface);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.rcard.wolf{border-color:var(--wolf)}.rcard.third{border-color:var(--third)}
.rcard .em{font-size:64px;line-height:1}.rcard.big .em{font-size:88px}.rcard .rn{font-family:var(--font-display);font-size:28px;font-weight:700}.rcard p{font-size:15px}
.peek{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:48px;padding:8px 14px;border-radius:12px;border:1px dashed var(--line);background:var(--surface);text-align:left}
.roster{display:flex;flex-direction:column}.pl{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14.5px}.pl.dead .nm{text-decoration:line-through;color:var(--muted)}.pl .tg{color:var(--muted);font-size:13px;text-align:right}
.dawn p{font-size:15.5px}.dawn .big{font-size:19px;font-weight:600}.moon{font-size:60px}
.ghost{font-family:var(--font-display);font-size:28px;letter-spacing:.3em;overflow-wrap:anywhere}
.chat{max-height:120px;overflow:auto;font-size:14px;background:var(--bg);border-radius:8px;padding:6px 8px;min-height:36px}
.log{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;max-height:260px;overflow:auto}
.verdict{font-family:var(--font-display);font-size:26px;font-weight:700}.verdict.win{color:var(--good)}
table.roles{width:100%;border-collapse:collapse;font-size:14.5px}table.roles td{padding:6px 4px;border-top:1px solid var(--line)}table.roles tr.won td{font-weight:600;color:var(--good)}
details summary{cursor:pointer;font-family:var(--font-display);font-weight:600;min-height:32px}details ol{margin:8px 0 0;padding-left:1.3em;color:var(--muted);font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.selrow select{margin-left:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:20;max-width:90vw}
#hostgone{position:fixed;top:0;left:0;right:0;z-index:50;padding:10px 14px;background:#B3261E;color:#fff;font-size:14px;text-align:center}
.ri{flex:none;position:relative;width:60px;height:60px;border-radius:12px;overflow:hidden;background:var(--accent-soft);display:grid;place-items:center;cursor:zoom-in}
.ri img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.ri i{display:none;font-style:normal;font-size:30px;line-height:1}.ri.noimg{cursor:default}.ri.noimg i{display:block}
.ri.sm{width:26px;height:26px;border-radius:50%}.ri.sm i{font-size:15px}
.rinfo{align-items:center}
.zoomov{position:fixed;inset:0;z-index:50;background:#000c;display:grid;place-items:center;padding:20px;cursor:zoom-out}
.zoomov img{max-width:min(92vw,420px);max-height:86vh;border-radius:16px;box-shadow:0 10px 40px #000a}
.rcard .cardimg{display:none}.rcard.hasimg{padding:0;background:none;border:0;box-shadow:none;max-width:340px;margin-inline:auto}.rcard.hasimg>*:not(.cardimg):not(.warnbox){display:none}.rcard.hasimg .cardimg{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 8px 28px #0008}
</style></head><body><div id="hostgone" hidden>⚠️ ผู้ดำเนินเกมหลุดการเชื่อมต่อ เกมถูกบันทึกไว้แล้ว รอผู้ดำเนินเกมกลับเข้ามา (ใช้ปุ่ม “กลับเข้าห้อง” ในหน้าแรก)</div><main id="app"></main><script>

 {id:"seer",th:"เทพพยากรณ์",e:"🔮",v:7,t:"v",max:1,d:"ทุกคืนเลือกผู้เล่น 1 คน แล้วจะรู้ว่าเขาเป็นมนุษย์หมาป่าหรือไม่"},

const RM = {}; ROLES.forEach(r => RM[r.id] = r);
const UNSURE = { drunk:"ตัวเลขบนการ์ดอ่านค่อนข้างยาก", priest:"ตัวเลขบนการ์ดอ่านค่อนข้างยาก", bandit:"บนการ์ดเป็นสัญลักษณ์ ○ (ตีความเป็น 0)" };
const DRUNK_POOL = ["priest","bodyguard","hunter","aura","investigator","witch","hag","spellcaster","troublemaker","mayor","prince","diseased","brute","pacifist","idiot"];
/* ================= engine: pure game rules, no DOM / network ================= */
const rand = n => Math.floor(Math.random()*n);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rand(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const rname = p => (p.role==="drunk" && p.trueRole && p.f.drunkWoke) ? RM[p.role].th : RM[p.role].th;
const eff = p => (p.role==="drunk" && p.trueRole) ? p.trueRole : p.role;
const isKiller = p => p.alive && (p.role==="werewolf"||p.role==="lone"||p.role==="cub"||(p.role==="cursed"&&p.f.converted));
const wolfSide = p => isKiller(p) || (p.alive && (p.role==="minion"||p.role==="sorceress"));
const seesWolf = p => { const r=eff(p); return r==="werewolf"||r==="lone"||r==="cub"||r==="halfwolf"||(p.role==="cursed"&&p.f.converted); };
const auraSpecial = p => { const r=eff(p); if(p.role==="cursed"&&p.f.converted) return false; return !(r==="villager"||r==="werewolf"); };

function newGame(names, roleIds, opt){
  opt = opt||{};
  const N = names.length, deal = shuffle(roleIds);
  const G = { N, p:names.map((nm,i)=>({ name:nm, role:deal[i], trueRole:null, alive:true, ghost:false, f:{ msgs:[] } })),
    night:0, phase:"deal", acts:{}, log:[], pub:[], dawn:[], voteres:null, hunterQ:[], reveal:opt.reveal!==false,
    protect:new Set(), killCount:1, cubPending:false, sickNext:false, wolvesSick:false, mute:null, hexed:null,
    dayDouble:false, votesLeft:0, votes:{}, bruteQ:null, cultOrder:[], ghostChars:null, beggarWon:false,
    vampMark:null, over:null, after:null, pack:new Set(), introPos:0, introOrder:[], dayNo:0 };
  const inDeck = new Set(deal);
  G.p.forEach((p,i) => {
    if (p.role==="cult"){ p.f.cultLeader=true; p.f.cult=true; }
    if (p.role==="drunk"){ const el = DRUNK_POOL.filter(r=>!inDeck.has(r)); p.trueRole = el.length ? el[rand(el.length)] : "villager"; }
    if (p.role==="ghost"){ p.alive=false; p.ghost=true; }
    if (p.role==="werewolf"||p.role==="lone"||p.role==="cub"||p.role==="minion"||p.role==="sorceress") G.pack.add(i);
  });

}
const aliveIdx = G => G.p.map((p,i)=>i).filter(i=>G.p[i].alive);
const L = (G,s) => { G.log.push(s); if (G.log.length>400) G.log.shift(); };
const nm = (G,i) => G.p[i].name;
const roleTxt = (G,i) => { const p=G.p[i]; return (G.reveal||G.over||p.ghost) ? RM[p.role].th : null; };

/* ---------- introduction round ---------- */
function startIntro(G){
  G.phase="intro";
  G.introOrder = G.p.map((p,i)=>i).filter(i=>!G.p[i].ghost);
  G.introPos = 0;
}
function introNext(G){ G.introPos++; return G.introPos < G.introOrder.length; }

/* ---------- night ---------- */
function startNight(G){
  G.night++; G.phase="night"; G.acts={}; G.protect=new Set(); G.dawn=[]; G.voteres=null;
  G.killCount = G.cubPending ? 2 : 1; G.cubPending=false; G.wolvesSick=G.sickNext; G.sickNext=false;
  G.mute=null; G.hexed=null; G.dayDouble=false;
  if (G.night===3) G.p.forEach((p,i)=>{ if (p.role==="drunk" && p.alive){
    p.role=p.trueRole; p.f.drunkWoke=true;
    p.f.msgs.unshift({n:3,text:"คุณตื่นจากอาการเมาแล้ว! บทบาทจริงของคุณคือ “"+RM[p.role].th+"” เริ่มใช้พลังได้ตั้งแต่คืนนี้"}); L(G,nm(G,i)+" (ขี้เมา) ตื่นเป็น "+RM[p.role].th);
  }});
  L(G,"=== คืนที่ "+G.night+" ===");
}
function nightSpec(G,i){
  const p=G.p[i], n=G.night, r=p.role;
  if (p.ghost) return n===1 ? {k:"text",title:"ข้อความจากยมโลก",hint:"เขียน 10 ตัวอักษร ทุกเช้าระบบจะเผยทีละตัว ห้ามระบุชื่อผู้เล่น"} : null;
  if (!p.alive) return null;
  const all=aliveIdx(G), oth=all.filter(j=>j!==i);
  const pk=(nn,pool,title,hint,opt)=> pool.length>=nn||opt ? {k:"pick",n:Math.min(nn,pool.length),pool,title,hint,opt:!!opt} : null;
  switch(r){
    case "cupid": return n===1 ? pk(2,all,"เลือกคู่รัก 2 คน","เลือกตัวเองได้ ทั้งคู่จะรู้จักกัน") : null;
    case "doppel": return n===1 && p.f.copy==null ? pk(1,oth,"เลือกผู้เล่นที่จะลอกบทบาท","เมื่อเขาตาย คุณจะได้บทบาทของเขา") : null;
    case "bandit": return n===1 ? pk(2,oth,"ชี้ผู้เล่น 2 คน","ถ้าทั้งสองตายและคุณรอดถึงจบเกม คุณชนะเพิ่ม") : null;
    case "spellcaster": return pk(1,all.filter(j=>!(p.f.mutedPast||[]).includes(j)),"เลือกคนที่จะเป็นใบ้พรุ่งนี้","ตัวเองก็ได้ ห้ามซ้ำคนเดิม");
    case "seer": return pk(1,oth,"ส่องผู้เล่น 1 คน","จะรู้ว่าเป็นมนุษย์หมาป่าหรือไม่");
    case "aura": return pk(1,oth,"ส่องผู้เล่น 1 คน","จะรู้ว่ามีบทบาทพิเศษหรือไม่");
    case "investigator": return p.f.used ? null : pk(1,oth,"ตรวจผู้เล่น 1 คนกับเพื่อนซ้าย-ขวา","ใช้ได้ครั้งเดียว หรือกดข้ามเก็บไว้ก่อน",true);
    case "priest": return p.f.used ? null : pk(1,oth,"ให้พรผู้เล่น 1 คน","ใช้ได้ครั้งเดียว หรือกดข้ามเก็บไว้ก่อน",true);
    case "bodyguard": return pk(1,oth.filter(j=>j!==p.f.lastProt),"คุ้มครองผู้เล่น 1 คน","ห้ามเลือกตัวเอง และห้ามคนเดิมสองคืนติด");
    case "witch": { const h=!p.f.healUsed, x=!p.f.killUsed; return (h||x) ? {k:"witch",pool:all,heal:h,kill:x,title:"ยาของแม่มด",hint:"ใช้ได้ขวดละครั้งต่อเกม เลือกใช้ทั้งสองหรือข้ามก็ได้"} : null; }
    case "hag": return pk(1,oth,"สาปแช่งผู้เล่น 1 คน","เขาจะหายไปจากเกมตลอดวันพรุ่งนี้");
    case "troublemaker": return p.f.used ? null : {k:"yn",title:"ใช้พลังตัวป่วนไหม?",hint:"ใช้ได้ครั้งเดียว วันพรุ่งนี้จะโหวตกำจัด 2 คน"};
    case "cult": if (!p.f.cultLeader) return null; return pk(1,oth.filter(j=>!G.p[j].f.cult),"ชักจูงผู้เล่น 1 คนเข้าลัทธิ","เขาจะไม่รู้ตัว");
    case "sorceress": return pk(1,oth,"ส่องผู้เล่น 1 คน","จะรู้ว่าเป็นเทพพยากรณ์หรือไม่");
    case "vampire": return pk(1,oth,"เลือกเหยื่อ 1 คน","เขาจะตายตอนเริ่มโหวตของวันพรุ่งนี้");
  }
  if (p.f.cult && p.f.cultLeader && r!=="cult") return pk(1,oth.filter(j=>!G.p[j].f.cult),"ชักจูงผู้เล่น 1 คนเข้าลัทธิ","เขาจะไม่รู้ตัว");
  if (isKiller(p) && n>=2 && !G.wolvesSick){
    const pool = all.filter(j=>!G.pack.has(j));
    const nn = Math.min(G.killCount,pool.length);
    return nn ? {k:"wolf",n:nn,pool,title:G.killCount===2?"เลือกเหยื่อ 2 คน":"เลือกเหยื่อ",hint:"หมาป่าส่วนใหญ่ต้องเลือกตรงกันจึงจะกำจัดได้"} : null;
  }
  return null;
}
function submitAct(G,i,a){
  const s=nightSpec(G,i); if(!s||!a) return false;
  const okIdx = x => Number.isInteger(x) && s.pool && s.pool.includes(x);
  if (s.k==="pick"||s.k==="wolf"){
    const t=Array.isArray(a.t)?a.t:[];
    if (t.length===0 && s.opt){ G.acts[i]={t:[]}; return true; }
    if (t.length!==s.n || new Set(t).size!==t.length || !t.every(okIdx)) return false;
    G.acts[i]={t:t.slice()}; return true;
  }
  if (s.k==="witch"){
    const h=a.h==null?null:a.h, x=a.x==null?null:a.x;
    if ((h!=null && (!s.heal||!okIdx(h))) || (x!=null && (!s.kill||!okIdx(x)))) return false;
    G.acts[i]={h,x}; return true;
  }
  if (s.k==="yn"){ G.acts[i]={y:!!a.y}; return true; }
  if (s.k==="text"){ const seg=[...String(a.s||"").replace(/\s+/g,"")]; if(!seg.length||seg.length>10) return false; G.acts[i]={s:seg.join("")}; return true; }
  return false;
}
const pendingActors = G => G.p.map((p,i)=>i).filter(i=>nightSpec(G,i) && !G.acts[i]);
const nightDone = G => pendingActors(G).length===0;

function wolfTarget(G){
  const w=G.p.map((p,i)=>i).filter(i=>isKiller(G.p[i]) && nightSpec(G,i));
  if(!w.length) return null; const c={};
  w.forEach(i=>{ const a=G.acts[i]; if(a&&a.t&&a.t.length){ const k=[...a.t].sort((x,y)=>x-y).join(","); c[k]=(c[k]||0)+1; }});
  let best=null; Object.keys(c).forEach(k=>{ if(c[k]*2>w.length) best=k; });
  return best ? best.split(",").map(Number) : null;
}
function note(G,i,text){ G.p[i].f.msgs.unshift({n:G.night,text}); }

function kill(G,i,cause,force){
  const p=G.p[i]; if(!p.alive) return false;
  if (!force && p.f.shield){ p.f.shield=false; L(G,nm(G,i)+" รอดจาก "+cause+" เพราะพรนักบวช"); return false; }
  p.alive=false; p.f.cause=cause; G.deaths.push(i);
  const rt=roleTxt(G,i);
  G.pub.push(nm(G,i)+" ถูกกำจัด"+(rt?" (บทบาท: "+rt+")":""));
  L(G,nm(G,i)+" ("+RM[p.role].th+") ตาย: "+cause);
  if (p.f.lover!=null && G.p[p.f.lover].alive){ G.pub.push(nm(G,p.f.lover)+" ตรอมใจตายตามคู่รัก"); kill(G,p.f.lover,"คู่รักตาย",true); }
  if (p.role==="hunter") G.hunterQ.push(i);
  if (p.role==="cub") G.cubPending=true;
  if (p.role==="seer"){ const a=G.p.findIndex(q=>q.alive&&q.role==="apprentice"); if(a>=0){ G.p[a].role="seer"; note(G,a,"เทพพยากรณ์ตายแล้ว คุณสืบทอดเป็นเทพพยากรณ์ ส่องได้ตั้งแต่คืนถัดไป"); L(G,nm(G,a)+" สืบทอดเป็นเทพพยากรณ์"); } }
  if (p.f.cultLeader){ p.f.cultLeader=false; const nx=G.cultOrder.find(j=>G.p[j].alive); if(nx!=null){ G.p[nx].f.cultLeader=true; note(G,nx,"คุณได้เป็นเจ้าลัทธิคนใหม่ ชักจูงคนเพิ่มได้ทุกคืน"); } }
  G.p.forEach((q,j)=>{ if(q.alive && q.role==="doppel" && q.f.copy===i){
    q.role=p.role; q.f={ msgs:q.f.msgs, becameFrom:i }; if(q.role==="cult") q.f.cultLeader=true, q.f.cult=true;
    if(isKiller(q)||q.role==="minion"||q.role==="sorceress") G.pack.add(j);
    note(G,j,"คุณรับบทบาทใหม่: “"+RM[q.role].th+"”"); L(G,nm(G,j)+" (ภูตจำแลง) กลายเป็น "+RM[q.role].th); } });
  if (G.bruteQ===i) G.bruteQ=null;
  return true;
}
function attempt(G,t,cause){ if(!G.p[t].alive) return; if(G.protect.has(t)){ L(G,nm(G,t)+" ถูกคุ้มครองจาก "+cause); return; } kill(G,t,cause); }

function endNight(G){
  G.pub=[]; G.deaths=[]; const A=G.acts, P=G.p, N=G.night;
  P.forEach((p,i)=>{ const a=A[i]; if(!a) return; const r=p.role, t=a.t||[];
    if (p.ghost && a.s){ G.ghostChars=[...a.s]; L(G,"พรายกระซิบเขียน: "+a.s); return; }
    if (r==="cupid" && t.length===2){ P[t[0]].f.lover=t[1]; P[t[1]].f.lover=t[0]; note(G,t[0],"คุณเป็นคู่รักกับ “"+nm(G,t[1])+"”"); note(G,t[1],"คุณเป็นคู่รักกับ “"+nm(G,t[0])+"”"); L(G,"กามเทพจับคู่ "+nm(G,t[0])+" + "+nm(G,t[1])); }
    if (r==="doppel" && t.length) { p.f.copy=t[0]; L(G,nm(G,i)+" (ภูตจำแลง) เลือก "+nm(G,t[0])); }
    if (r==="bandit" && t.length) { p.f.marks=t.slice(); L(G,nm(G,i)+" (อันธพาล) ชี้ "+t.map(x=>nm(G,x)).join(", ")); }
    if (p.f.cultLeader && t.length){ P[t[0]].f.cult=true; G.cultOrder.push(t[0]); note(G,i,"ชักจูง “"+nm(G,t[0])+"” เข้าลัทธิแล้ว"); L(G,"เจ้าลัทธิชักจูง "+nm(G,t[0])); }

    if (r==="spellcaster" && t.length){ G.mute=t[0]; (p.f.mutedPast=p.f.mutedPast||[]).push(t[0]); L(G,"จอมเวทปิดปาก "+nm(G,t[0])); }
    if (r==="bodyguard" && t.length){ G.protect.add(t[0]); p.f.lastProt=t[0]; L(G,"บอดี้การ์ดคุ้มครอง "+nm(G,t[0])); }
    if (r==="witch"){ if(a.h!=null){ G.protect.add(a.h); p.f.healUsed=true; L(G,"แม่มดช่วย "+nm(G,a.h)); } }
    if (r==="priest" && t.length){ P[t[0]].f.shield=true; p.f.used=true; L(G,"นักบวชให้พร "+nm(G,t[0])); }
    if (r==="troublemaker" && a.y){ G.dayDouble=true; p.f.used=true; L(G,"ตัวป่วนใช้พลัง: พรุ่งนี้โหวต 2 ครั้ง"); }
    if (r==="seer" && t.length) note(G,i,"ส่อง “"+nm(G,t[0])+"”: "+(seesWolf(P[t[0]])?"เป็นมนุษย์หมาป่า 🐺":"ไม่ใช่มนุษย์หมาป่า"));
    if (r==="aura" && t.length) note(G,i,"ส่อง “"+nm(G,t[0])+"”: "+(auraSpecial(P[t[0]])?"เป็นตัวละครพิเศษ ✨":"ชาวบ้าน/หมาป่าธรรมดา"));
    if (r==="sorceress" && t.length) note(G,i,"ส่อง “"+nm(G,t[0])+"”: "+(P[t[0]].role==="seer"?"เป็นเทพพยากรณ์! 🔮":"ไม่ใช่เทพพยากรณ์"));
    if (r==="investigator" && t.length){ p.f.used=true; const al=aliveIdx(G), k=al.indexOf(t[0]), tr=[al[(k+al.length-1)%al.length],t[0],al[(k+1)%al.length]];
      const has=tr.some(j=>isKiller(P[j])); note(G,i,"ตรวจ “"+nm(G,t[0])+"” และเพื่อนซ้าย-ขวา ("+[...new Set(tr)].map(j=>nm(G,j)).join(", ")+"): "+(has?"มีมนุษย์หมาป่าปะปนอยู่":"ไม่มีมนุษย์หมาป่า")); }
  });
  /* kills */
  if (G.bruteQ!=null){ const b=G.bruteQ; G.bruteQ=null; attempt(G,b,"หนุ่มถึกถูกหมาป่ากำจัด (เลื่อนมาคืนนี้)"); }

/* ---------- settle: hunters first, then win check ---------- */
function settle(G,next){

}
function hunterShoot(G,t){

  const keys=Object.keys(counts).map(Number); let elim=null;
  if (keys.length){ const mx=Math.max(...keys.map(k=>counts[k])); const tops=keys.filter(k=>counts[k]===mx); if (tops.length===1 && mx>none) elim=tops[0]; }

function checkWin(G){
  const al=aliveIdx(G), P=G.p;
  if (!al.length) return {w:"none",text:"ไม่มีผู้รอดชีวิต เสมอกัน"};
  if (al.length===2 && P[al[0]].f.lover===al[1]){
    const tm=i=>wolfSide(P[i])?"w":(P[i].role==="vampire"?"x":"v");
    if (tm(al[0])!==tm(al[1])) return {w:"lovers",text:"คู่รักข้ามฝ่ายอยู่รอดเป็นสองคนสุดท้าย 💘"};
  }
  const leader=al.find(i=>P[i].f.cultLeader);
  if (leader!=null && al.length>1 && al.every(i=>P[i].f.cult)) return {w:"cult",text:"ผู้เล่นที่เหลือทุกคนอยู่ในลัทธิ 🌀"};
  const killers=al.filter(i=>isKiller(P[i])), wteam=al.filter(i=>wolfSide(P[i])), vamps=al.filter(i=>P[i].role==="vampire");
  const lone=al.find(i=>P[i].role==="lone");
  if (!killers.length && !vamps.length) return {w:"village",text:"มนุษย์หมาป่าถูกกำจัดหมดแล้ว ฝ่ายชาวบ้านชนะ 🏘️"};
  if (lone!=null && al.length<=2) return {w:"lone",text:"มนุษย์หมาป่าเดียวดายอยู่รอดคนสุดท้าย 🌑"};
  if (vamps.length){
    if (al.length===vamps.length) return {w:"vamp",text:"เหลือแต่แวมไพร์ 🧛"};
    if (!killers.length && vamps.length>=al.length-vamps.length) return {w:"vamp",text:"แวมไพร์ครองหมู่บ้าน 🧛"};
    if (al.length===wteam.length) return {w:"wolf",text:"เหลือแต่ฝ่ายมนุษย์หมาป่า 🐺"};
    return null;
  }
  const others=al.length-wteam.length;
  if (lone!=null){ if (others===0) return {w:"wolf",text:"เหลือแต่ฝ่ายมนุษย์หมาป่า 🐺"}; return null; }
  if (wteam.length>=others) return {w:"wolf",text:"ฝ่ายมนุษย์หมาป่ามีจำนวนเท่ากับหรือมากกว่าที่เหลือ 🐺"};
  return null;
}
function finish(G,w){

    if(p.role==="bandit"&&p.alive&&p.f.marks&&p.f.marks.every(m=>!G.p[m].alive)) ex.push(p.name+" (อันธพาล) ชนะเพิ่ม"); });

}
function winnersOf(G){ /* seats that won */
  const w=G.over.w, P=G.p, s=new Set();
  P.forEach((p,i)=>{ const side = (p.role==="lone")?"lone":(wolfSide({...p,alive:true})||(p.role==="cursed"&&p.f.converted))?"wolf":p.role==="vampire"?"vamp":"village";
    if (w==="village" && side==="village" && p.role!=="beggar") s.add(i);
    if (w==="wolf" && side==="wolf") s.add(i);
    if (w==="vamp" && side==="vamp") s.add(i);
    if (w==="lone" && side==="lone") s.add(i);
    if (w==="cult" && p.f.cult) s.add(i);
    if (w==="lovers" && p.f.lover!=null && p.alive) s.add(i);

    if (p.role==="bandit"&&p.alive&&p.f.marks&&p.f.marks.every(m=>!G.p[m].alive)) s.add(i);
    if (w==="village" && p.role==="ghost") s.add(i);

  return [...s];
}

/* ---------- deck helpers ---------- */
function deckSum(c){ let s=0, n=0; Object.keys(c).forEach(k=>{ if(RM[k]){ s+=RM[k].v*c[k]; n+=c[k]; } }); return {sum:s,n}; }
function autoDeck(N){
  const wolfPool=["lone","cub","minion","sorceress"], spec=ROLES.filter(r=>r.t!=="w"&&r.id!=="villager"&&r.id!=="mason"&&r.id!=="apprentice").map(r=>r.id);
  let best=null, bestS=1e9;
  for (let tr=0;tr<600;tr++){
    const c={}; const add=(k,n)=>{ c[k]=(c[k]||0)+(n||1); };
    const wn=Math.max(1,Math.round(N/4)); add("werewolf",wn);
    if (N>=7 && Math.random()<.35) add("minion"); else if (N>=8 && Math.random()<.2) add("sorceress");
    if (N>=9 && Math.random()<.15) add("cub");
    let have=deckSum(c).n; const sp=shuffle(spec);
    if (N>=8 && Math.random()<.5 && have+3<=N) { add("seer"); add("apprentice"); have+=2; }
    else if (Math.random()<.8 && have<N) { add("seer"); have++; }
    if (N>=8 && Math.random()<.35 && have+2<=N) { add("mason",2); have+=2; }
    while (have<N){ if (Math.random()<.35 || !sp.length){ add("villager"); } else { const k=sp.pop(); if(!c[k]) add(k); else add("villager"); } have=deckSum(c).n; }
    if (c.apprentice && !c.seer) continue;
    const s=Math.abs(deckSum(c).sum)+Math.random()*.5; if (s<bestS){ bestS=s; best=c; }
  }
  return best;
}

function hostRecv(i,d){

  if(d.t==="cmd" && i===0) return modCmd(d);
  if(i===0) return;  // moderator has no seat
  const s=seatOf(i);
  if(d.t==="ready" && ph==="deal"){ H.ready.add(s); pushAll(); }
  else if(d.t==="act" && ph==="night" && G.phase==="night"){ if(submitAct(G,s,d.a)){ H.dirty=1; pushAll(); if(nightReady(G)) { H.nightAuto=Date.now()+1500; } else H.nightAuto=0; } }
  else if(d.t==="vote" && G&&G.phase==="vote"){ if(submitVote(G,s,d.v)) pushAll(); }
  else if(d.t==="shoot" && G&&G.phase==="hunter" && G.hunterQ[0]===s){ hunterShoot(G,d.v==null?null:+d.v); pushAll(); }
  else if(d.t==="chat" && G&&G.phase==="night"){ const p=G.p[s]; if(p&&isKiller(p)&&p.alive){ const txt=clean(d.s,40); if(txt){ H.wolfChat.push({n:p.name,s:txt}); if(H.wolfChat.length>30) H.wolfChat.shift(); pushAll(); } } }
}
function modCmd(d){
  const G=H.G;
  switch(d.c){
    case "settings": if(H.phase==="lobby"){ const st=H.settings; if(d.counts){ const c={}; Object.keys(d.counts).forEach(k=>{ if(RM[k]){ const n=Math.max(0,Math.min(RM[k].max,+d.counts[k]|0)); if(n) c[k]=n; } }); st.counts=c; }
        if(d.reveal!=null) st.reveal=!!d.reveal; if([0,20,30,45,60].includes(+d.intro)) st.intro=+d.intro; if([3,5,8,10,15].includes(+d.day)) st.day=+d.day; pushAll(); } break;
    case "auto": if(H.phase==="lobby"){ const n=H.players.length-1; if(n>=4){ H.settings.counts=autoDeck(n); pushAll(); } } break;
    case "start": hostStart(); break;
    case "intro": if(H.phase==="deal"&&G.phase==="deal"){ if(H.settings.intro>0){ startIntro(G); H.phase="intro"; H.introEnd=Date.now()+H.settings.intro*1000; } else { startNight(G); H.phase="night"; } pushAll(); } break;
    case "introNext": if(H.phase==="intro"){ if(introNext(G)) H.introEnd=Date.now()+H.settings.intro*1000; else { H.phase="introdone"; } pushAll(); } break;
    case "night": if(H.phase==="introdone"||H.phase==="intro"||(H.phase==="deal"&&G.phase==="deal")){ startNight(G); H.phase="night"; H.wolfChat=[]; pushAll(); } else if(G&&G.phase==="voteres"){ afterVote(G); afterPhase(); } break;
    case "endnight": if(G&&G.phase==="night"){ endNight(G); afterPhase(); } break;
    case "vote": if(G&&G.phase==="day"){ startVote(G); afterPhase(); } break;
    case "endvote": if(G&&G.phase==="vote"){ endVote(G); afterPhase(); } break;
    case "shoot": if(G&&G.phase==="hunter"){ hunterShoot(G,d.v==null?null:+d.v); afterPhase(); } break;
    case "again": if(H.phase==="over"||H.phase==="intro"||H.phase==="deal"||G){ H.G=null; H.phase="lobby"; H.players=H.players.filter((p,k)=>k===0||p.connected); pushAll(); } break;

function cardBlock(pv,big){
  return '<div class="rcard hasimg '+(pv.t==="w"?"wolf":pv.t==="x"?"third":"vill")+(big?" big":"")+'"><img class="cardimg" data-r="'+esc(pv.role)+'" src="images/'+esc(pv.role)+'.jpg" alt="'+esc(pv.rn)+'" onerror="cardFb(this)"><div class="em">'+pv.e+'</div><div class="rn">'+esc(pv.rn)+'</div><div class="rm">'+TEAMN[pv.t]+' · '+valChip({v:pv.v})+'</div><p>'+esc(pv.d)+'</p>'+(pv.role==="cursed"&&pv.converted?'<p class="warnbox">ตอนนี้คุณเป็นมนุษย์หมาป่าแล้ว</p>':"")+'</div>';
}

/* ---------- entry / lobby ---------- */
function vEntry(){
  const connecting=O.phase==="connecting";
  return '<div class="brand"><div class="mark">🐺 มนุษย์หมาป่า</div><p>เกมจับผิดหมาป่าออนไลน์ เล่นบนมือถือของตัวเอง คุยกันผ่านสายนอกเกม มีเพื่อนหนึ่งคนเป็นผู้ดำเนินเกม</p></div>'+
  '<div class="panel"><label class="label" for="nm">ชื่อของคุณ</label><input id="nm" maxlength="20" value="'+esc(O.name)+'" placeholder="เช่น บีม" autocomplete="off">'+
  (O.err?'<div class="errbox">'+esc(O.err)+'</div>':"")+
  '<div class="label">เข้าร่วมห้อง (ผู้เล่น)</div><div class="row"><input id="cd" class="code" maxlength="4" value="'+esc(O.joinCode)+'" placeholder="รหัส 4 ตัว" autocapitalize="characters" autocomplete="off"><button class="btn primary" data-a="join" '+(connecting?"disabled":"")+'>เข้าร่วม</button></div>'+
  '<div class="label">หรือ</div><button class="btn block" data-a="create" '+(connecting?"disabled":"")+'>สร้างห้อง (คุณเป็นผู้ดำเนินเกม ไม่ได้เล่น)</button>'+
  (()=>{ let c=""; try{c=localStorage.getItem("ww-host")||"";}catch(e){} return c?'<button class="btn block" data-a="resume" '+(connecting?"disabled":"")+'>กลับเข้าห้อง '+esc(c)+' (ผู้ดำเนินเกมเดิม)</button>':""; })()+(!dbOK()?'<div class="errbox">ยังไม่ได้ตั้งค่า Firebase: แก้ค่า FB ที่ต้นสคริปต์ในไฟล์ index.html</div>':"")+(connecting?'<div class="hint">กำลังเชื่อมต่อ…</div>':"")+'</div>'+
  '<details class="panel rules"><summary>วิธีเล่นสั้นๆ</summary><ol><li>เพื่อนคนหนึ่งสร้างห้องเป็นผู้ดำเนินเกม คนอื่นกรอกรหัสเข้าร่วม</li><li>ผู้ดำเนินเกมเลือกไพ่ ดูมิเตอร์ความสมดุล แล้วเริ่มเกม ทุกคนดูไพ่ของตัวเองบนมือถือ</li><li>กลางคืน ทุกคนปิดไมค์และเลือกพลังบนมือถือ กลางวันคุยกันในสายแล้วโหวตในเกม</li><li>ฝ่ายชาวบ้านต้องกำจัดมนุษย์หมาป่า ส่วนหมาป่าต้องมีจำนวนเท่ากับหรือมากกว่าที่เหลือ</li></ol></details>';
}
function modLobby(){
  const lb=O.lobby, st=lb.settings, c=st.counts, nPl=lb.players.length-1, tot=deckSum(c).n;
  const grp=(t,title)=>'<div class="label">'+title+'</div>'+ROLES.filter(r=>t==="v"?(r.t==="v"&&r.v>0):t==="n"?(r.t==="v"&&r.v<=0):(r.t==="w"||r.t==="x")).map(r=>{ const n=c[r.id]||0;
    return '<div class="rrow '+(n?"on":"")+'"><div class="rinfo">'+rimg(r.id)+'<div><div class="rt">'+esc(r.th)+' '+valChip(r)+(UNSURE[r.id]?' <span class="q" title="'+esc(UNSURE[r.id])+'">?</span>':"")+'</div><div class="rd">'+esc(r.d)+'</div></div></div><div class="stepper"><button class="btn round" data-a="cnt" data-k="'+r.id+'" data-d="-1" aria-label="ลด">−</button><span class="num">'+n+'</span><button class="btn round" data-a="cnt" data-k="'+r.id+'" data-d="1" aria-label="เพิ่ม">+</button></div></div>'; }).join("");
  const warns=[]; if(c.apprentice&&!c.seer) warns.push("มีศิษย์เทพพยากรณ์แต่ไม่มีเทพพยากรณ์"); if(c.mason===1) warns.push("เมสันควรมีอย่างน้อย 2 คน"); if(!(c.werewolf||c.lone||c.cub)) warns.push("ยังไม่มีมนุษย์หมาป่าตัวที่ฆ่าได้");
  return head("ห้องรอ — คุณคือผู้ดำเนินเกม")+invite()+
  '<div class="panel"><div class="label">ผู้เล่น ('+nPl+' คน)</div>'+(nPl?'<div class="chips">'+lb.players.slice(1).map(p=>'<span class="chip">'+(p.connected?"🟢":"⚪")+" "+esc(p.name)+'</span>').join("")+'</div>':'<div class="hint">รอเพื่อนเข้าร่วม… ส่งลิงก์หรือรหัสด้านบน (ผู้ดำเนินเกมไม่นับเป็นผู้เล่น)</div>')+'</div>'+
  '<div class="panel"><div class="row between"><h3>เลือกไพ่ '+tot+'/'+nPl+'</h3><button class="btn" data-a="auto" '+(nPl<4?"disabled":"")+'>🎲 สุ่มให้สมดุล</button></div>'+balance(c)+(warns.length?'<div class="warnbox">'+warns.map(esc).join("<br>")+'</div>':"")+
  '<div class="hint">จำนวนไพ่ต้องเท่ากับจำนวนผู้เล่น ตัวเลข + คือเข้าข้างฝ่ายมนุษย์ ตัวเลข − คือเข้าข้างหมาป่า ผลรวมใกล้ 0 คือสมดุล</div></div>'+
  '<div class="panel">'+grp("v","ฝ่ายชาวบ้าน (+)")+grp("n","ฝ่ายชาวบ้านที่มีจุดอ่อน (0 / −)")+grp("w","ฝ่ายมนุษย์หมาป่าและฝ่ายอื่น")+'</div>'+
  '<div class="panel"><div class="label">ตั้งค่า</div><label class="row"><input type="checkbox" data-a="rev" '+(st.reveal?"checked":"")+'> เปิดเผยบทบาทเมื่อผู้เล่นตาย</label>'+
  sel("intro","เวลาแนะนำตัวต่อคน (วินาที, 0 = ข้าม)",[0,20,30,45,60],st.intro)+sel("day","เวลาถกเถียงกลางวัน (นาที)",[3,5,8,10,15],st.day)+'</div>'+
  '<button class="btn primary block" data-a="start" '+(nPl<4||tot!==nPl?"disabled":"")+'>เริ่มเกม ('+nPl+' ผู้เล่น)</button><button class="btn ghost block" data-a="leave">ปิดห้อง</button>';
}
function sel(k,lab,opts,cur){ return '<label class="row between selrow"><span>'+lab+'</span><select data-a="set" data-k="'+k+'">'+opts.map(o=>'<option value="'+o+'"'+(o===cur?" selected":"")+'>'+o+'</option>').join("")+'</select></label>'; }
function head(t){ return '<div class="brand"><div class="mark">🐺 '+esc(t)+'</div></div>'; }
function invite(){ const url=location.origin+location.pathname+"?room="+O.code; return '<div class="panel invite"><div class="label">รหัสห้อง</div><div class="roomcode">'+esc(O.code)+'</div><div class="row"><button class="btn" data-a="copy" data-v="'+esc(url)+'">คัดลอกลิงก์เชิญ</button></div></div>'; }
function plLobby(){
  const lb=O.lobby, st=lb.settings, c=st.counts, tot=deckSum(c).n;
  return head("ห้องรอ")+invite()+'<div class="panel"><div class="label">ผู้เล่นในห้อง</div><div class="chips">'+lb.players.map((p,i)=>'<span class="chip">'+(i===0?"🎙️ ":p.connected?"🟢 ":"⚪ ")+esc(p.name)+(i===0?" (ผู้ดำเนินเกม)":"")+(i===O.me?" ← คุณ":"")+'</span>').join("")+'</div><div class="hint">รอผู้ดำเนินเกมเลือกไพ่และเริ่มเกม</div></div>'+
   '<div class="panel"><div class="label">ไพ่ในเกมนี้ ('+tot+' ใบ)</div>'+balance(c)+'<div class="chips">'+Object.keys(c).map(k=>'<span class="chip row" style="gap:6px;flex-wrap:nowrap">'+rimg(k,1)+esc(RM[k].th)+(c[k]>1?" ×"+c[k]:"")+' '+sg(RM[k].v)+'</span>').join("")+'</div></div><button class="btn ghost block" data-a="leave">ออกจากห้อง</button>';
}

/* ---------- moderator ---------- */
function vMod(v){
  const m=v.mod; let h=head("ผู้ดำเนินเกม"), body="";
  const phaseName=v.phase==="deal"?"แจกไพ่":v.phase==="intro"||v.phase==="introdone"?"แนะนำตัว":v.phase==="over"?"จบเกม":v.g==="night"?"คืนที่ "+v.night:v.g==="day"?"วันที่ "+v.dayNo:v.g==="vote"?"โหวต":v.g==="voteres"?"ผลโหวต":v.g==="hunter"?"นายพรานยิง":"";
  h+='<div class="stage">'+phaseName+' <span class="hint">· ห้อง '+esc(O.code)+'</span></div>';
  const ctl=(c,l,cls)=>'<button class="btn '+(cls||"primary")+' block" data-a="cmd" data-c="'+c+'">'+l+'</button>';
  if(v.phase==="deal"){ body+='<div class="panel"><h3>ผู้เล่นดูไพ่ ('+v.readyN+'/'+v.readyTot+')</h3><div class="hint">รอทุกคนกด “รับทราบ” แล้วค่อยเริ่ม (คุณเริ่มก่อนได้)</div>'+ctl("intro",v.introSecs>0?"เริ่มช่วงแนะนำตัว":"เริ่มคืนแรก")+'</div>'; }
  else if(v.phase==="intro"){ const w=v.players[v.introWho]; body+='<div class="panel center"><div class="label">ตาแนะนำตัว ('+(v.introPos+1)+'/'+v.introTotal+')</div><div class="who">'+esc(w?w.name:"")+'</div>'+timer(v.introEnd)+ctl("introNext","คนถัดไป")+ctl("night","ข้ามไปคืนแรก","ghost")+'</div>'; }
  else if(v.phase==="introdone"){ body+='<div class="panel center"><h3>แนะนำตัวครบแล้ว</h3>'+ctl("night","เริ่มคืนแรก 🌙")+'</div>'; }
  else if(v.g==="night"){ body+='<div class="panel"><h3>กลางคืน — ทุกคนปิดไมค์</h3><div class="hint">รอ: '+(m.waiting.length?m.waiting.map(s=>esc(v.players[s].name)+" ("+m.roles[s].e+")").join(", "):(m.wolfSplit?"หมาป่ายังเลือกเหยื่อไม่ตรงกัน":"ครบแล้ว กำลังขึ้นเช้า…"))+'</div>'+ctl("endnight","บังคับจบคืน ☀️","btn")+(m.wolfChat.length?'<div class="label">แชตหมาป่า</div>'+m.wolfChat.map(c=>'<div class="hint">'+esc(c.n)+': '+esc(c.s)+'</div>').join(""):"")+'</div>'; }
  else if(v.g==="day"){ body+=dawnBox(v)+'<div class="panel center"><div class="label">เวลาถกเถียง</div>'+timer(v.dayEnd)+ctl("vote","เริ่มโหวต 🗳️")+'</div>'; }
  else if(v.g==="vote"){ body+=(v.voteIntro.length?'<div class="panel">'+v.voteIntro.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div>':"")+'<div class="panel center"><h3>กำลังโหวต ('+v.votedN+'/'+v.voteTot+')</h3>'+ctl("endvote","สรุปผลโหวตเลย")+'</div>'; }
  else if(v.g==="voteres"){ body+=voteBox(v)+ctl("night","ต่อไป"+(v.votesLeft>0?" (โหวตอีกครั้ง)":" — เริ่มคืนถัดไป 🌙")); }
  else if(v.g==="hunter"){ body+='<div class="panel center"><h3>รอ '+esc(v.hunterWho||"")+' (นายพราน) เลือกเป้าหมาย</h3>'+ctl("shoot","ข้าม: ยิงขึ้นฟ้าแทน","ghost")+'</div>'; }
  else if(v.phase==="over"){ body+=overBox(v)+ctl("again","กลับไปห้องรอ (เล่นใหม่)"); }
  body+='<div class="panel"><div class="label">ผู้เล่นทั้งหมด (คุณเห็นไพ่ทุกใบ)</div>'+roster(v,true)+'</div>';
  body+='<details class="panel rules"><summary>บันทึกเกม (เฉพาะผู้ดำเนินเกม)</summary><div class="log">'+m.log.map(x=>'<div>'+esc(x)+'</div>').join("")+'</div></details><button class="btn ghost block" data-a="leave">ปิดห้อง</button>';
  return h+body;
}
function dawnBox(v){ return '<div class="panel dawn"><h3>☀️ เช้าวันที่ '+v.dayNo+'</h3>'+v.dawn.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div>'; }
function voteBox(v){ const r=v.voteres; return '<div class="panel dawn"><h3>🗳️ ผลโหวต</h3><p class="big">'+esc(r.text)+'</p>'+(r.extra||[]).map(x=>'<p>'+esc(x)+'</p>').join("")+'<details><summary>ดูว่าใครโหวตใคร</summary>'+r.lines.map(x=>'<div class="hint">'+esc(x)+'</div>').join("")+'</details></div>'; }
function overBox(v){ const o=v.over; return '<div class="panel dawn"><div class="verdict '+(o.w==="village"?"win":"")+'">'+esc(o.text)+'</div>'+(o.extra||[]).map(x=>'<p>'+esc(x)+'</p>').join("")+'<table class="roles">'+o.roles.map((r,i)=>'<tr class="'+(o.win.includes(i)?"won":"")+'"><td>'+r.e+'</td><td class="nm">'+esc(r.n)+'</td><td>'+esc(r.r)+(r.alive?"":" ✝")+'</td><td>'+(o.win.includes(i)?"🏆":"")+'</td></tr>').join("")+'</table></div>'; }

/* ---------- player ---------- */
function vPlayer(v){
  const pv=v.priv; let h=head("มนุษย์หมาป่า"), body="";
  if(v.phase==="deal"){
    return h+'<div class="stage">ไพ่ของคุณ</div>'+cardBlock(pv,true)+(pv.info.length?'<div class="panel">'+pv.info.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div>':"")+
     (pv.ready?'<div class="panel center"><p>รับทราบแล้ว รอผู้ดำเนินเกม… ('+v.readyN+'/'+v.readyTot+')</p></div>':'<button class="btn primary block" data-a="ready">รับทราบ — ซ่อนไพ่</button>')+'<div class="hint center">อย่าให้ใครเห็นหน้าจอของคุณ</div>';
  }
  const peek='<button class="peek" data-a="peek"><span>'+pv.e+' '+esc(pv.rn)+' '+valChip({v:pv.v})+'</span><span class="hint">'+(O.ui.peek?"ซ่อน":"แตะเพื่อดูไพ่")+'</span></button>'+(O.ui.peek?cardBlock(pv):"");
  const stage=!pv.alive?(pv.ghost?"👻 คุณเป็นผู้ชม (พรายกระซิบ)":"💀 คุณตายแล้ว — ห้ามพูดหรือบอกใบ้"):"";
  if(v.phase==="intro"){ const w=v.players[v.introWho], me=v.introWho===v.me; body+='<div class="panel center"><div class="label">ช่วงแนะนำตัว ('+(v.introPos+1)+'/'+v.introTotal+')</div><div class="who">'+(me?"ถึงตาคุณ!":esc(w?w.name:""))+'</div><div class="hint">'+(me?"แนะนำตัวในสายได้เลย":"ฟังการแนะนำตัวในสาย")+'</div>'+timer(v.introEnd)+'</div>'; }
  else if(v.phase==="introdone"){ body+='<div class="panel center"><p>แนะนำตัวครบแล้ว รอผู้ดำเนินเกมเริ่มคืนแรก</p></div>'; }
  else if(v.phase==="over"){ body+=overBox(v)+'<div class="hint center">รอผู้ดำเนินเกมเริ่มรอบใหม่</div>'; }
  else if(v.g==="night") body+=nightPanel(v);
  else if(v.g==="day") body+=dawnBox(v)+(v.dayEnd?'<div class="panel center"><div class="label">เวลาถกเถียง</div>'+timer(v.dayEnd)+'</div>':"")+(pv.alive?'<div class="hint center">คุยกันในสาย แล้วรอผู้ดำเนินเกมเริ่มโหวต</div>':"");
  else if(v.g==="vote") body+=(v.voteIntro.length?'<div class="panel">'+v.voteIntro.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div>':"")+votePanel(v);
  else if(v.g==="voteres") body+=voteBox(v)+'<div class="hint center">รอผู้ดำเนินเกม…</div>';
  else if(v.g==="hunter") body+=hunterPanel(v);
  if(pv.msgs.length&&v.phase!=="over") body+='<div class="panel"><div class="label">ข้อมูลลับของคุณ</div>'+pv.msgs.map(m=>'<p>'+(m.n?'<span class="hint">คืน '+m.n+': </span>':"")+esc(m.text)+'</p>').join("")+'</div>';
  if(pv.info.length&&v.phase!=="over") body+='<div class="panel">'+pv.info.map(x=>'<p>'+esc(x)+'</p>').join("")+'</div>';
  if(v.ghostChars&&v.ghostChars.length) body+='<div class="panel"><div class="label">ข้อความจากยมโลก</div><div class="ghost">'+v.ghostChars.map(esc).join(" ")+'</div></div>';
  return h+(stage?'<div class="stage">'+stage+'</div>':"")+peek+body+'<div class="panel"><div class="label">ผู้เล่น</div>'+roster(v,false)+'</div><button class="btn ghost block" data-a="leave">ออกจากห้อง</button>';
}
function pickChips(v,pool,sel,wolfPicks){
  return '<div class="chips">'+pool.map(j=>{ const on=sel.includes(j); const who=(wolfPicks||[]).filter(w=>w.pick&&w.pick.includes(v.players[j].name)).map(w=>w.n);
    return '<button class="chip pick" aria-pressed="'+on+'" data-a="tog" data-p="'+j+'">'+esc(v.players[j].name)+(who.length?' <small>('+who.map(esc).join(",")+')</small>':"")+'</button>'; }).join("")+'</div>';
}
function nightPanel(v){
  const pv=v.priv, p=pv.prompt;
  if(!p) return '<div class="panel center"><div class="moon">🌙</div><h3>กลางคืน</h3><p>หลับตา วางมือถือ… รอเช้า</p></div>';
  if(p.k==="info") return '<div class="panel center"><h3>'+esc(p.title)+'</h3><p>'+esc(p.hint)+'</p></div>';
  const sel=O.ui.sel;
  let b='<div class="panel"><h3>'+esc(p.title)+'</h3><div class="hint">'+esc(p.hint)+'</div>';
  if(p.k==="pick"||p.k==="wolf"){
    b+=pickChips(v,p.pool,sel,p.k==="wolf"?v.wolves:null);
    b+='<button class="btn primary block" data-a="submit" '+(sel.length!==p.n?"disabled":"")+'>ยืนยัน'+(p.n>1?" ("+sel.length+"/"+p.n+")":"")+'</button>'+(p.opt?'<button class="btn block" data-a="skip">ข้าม (เก็บไว้ก่อน)</button>':"");
    if(p.done) b+='<div class="okbox">✅ ส่งคำตอบแล้ว (เปลี่ยนได้จนกว่าจะขึ้นเช้า)</div>';
    if(p.k==="wolf"){ b+='<div class="label">หมาป่า</div>'+v.wolves.map(w=>'<div class="hint">'+esc(w.n)+': '+(w.pick?esc(w.pick.join(", ")):"ยังไม่เลือก")+'</div>').join("")+
      '<div class="label">แชตหมาป่า (เห็นเฉพาะหมาป่า)</div><div class="chat">'+v.chat.map(c=>'<div><b>'+esc(c.n)+'</b> '+esc(c.s)+'</div>').join("")+'</div><div class="row"><input id="chat" maxlength="40" placeholder="พิมพ์สั้นๆ"><button class="btn" data-a="chat">ส่ง</button></div>'; }
  } else if(p.k==="witch"){
    b+=(p.heal?'<div class="label">ยาช่วย (เลือกคนที่จะปกป้อง)</div>'+hx(v,p.pool,O.ui.h,"h"):"")+(p.kill?'<div class="label">ยาพิษ (เลือกคนที่จะกำจัด)</div>'+hx(v,p.pool,O.ui.x,"x"):"")+'<button class="btn primary block" data-a="submit">ยืนยัน (ไม่เลือก = ไม่ใช้)</button>'+(p.done?'<div class="okbox">✅ ส่งแล้ว</div>':"");
  } else if(p.k==="yn"){ b+='<div class="row"><button class="btn primary" data-a="yn" data-y="1">ใช้พลัง</button><button class="btn" data-a="yn" data-y="0">ยังไม่ใช้</button></div>'+(p.done?'<div class="okbox">✅ ส่งแล้ว</div>':""); }
  else if(p.k==="text"){ b+='<input id="gtxt" maxlength="14" placeholder="เช่น ระวังคนใกล้ตัว" value="'+esc(O.ui.txt)+'"><div class="hint">ใช้ได้ 10 ตัวอักษร (ไม่นับวรรค)</div><button class="btn primary block" data-a="gsend">ส่งข้อความ</button>'+(p.done?'<div class="okbox">✅ ส่งแล้ว</div>':""); }
  return b+'</div>';
}
function hx(v,pool,cur,key){ return '<div class="chips">'+pool.map(j=>'<button class="chip pick" aria-pressed="'+(cur===j)+'" data-a="hx" data-key="'+key+'" data-p="'+j+'">'+esc(v.players[j].name)+'</button>').join("")+'</div>'; }
function votePanel(v){
  const p=v.priv.prompt; if(!p) return '<div class="panel center"><p>'+(v.priv.alive?"คุณไม่ได้อยู่ในการโหวตรอบนี้":"ผู้ตายโหวตไม่ได้")+' ('+v.votedN+'/'+v.voteTot+')</p></div>';
  if(p.k==="auto") return '<div class="panel center"><h3>'+esc(p.title)+'</h3><p>'+esc(p.hint)+'</p></div>';
  return '<div class="panel"><h3>โหวตกำจัด ('+v.votedN+'/'+v.voteTot+')'+(v.votesLeft>1?" — รอบที่ 1 จาก 2":"")+'</h3><div class="chips">'+p.pool.map(j=>'<button class="chip pick" aria-pressed="'+(p.mine===j)+'" data-a="vote" data-p="'+j+'">'+esc(v.players[j].name)+'</button>').join("")+'<button class="chip pick" aria-pressed="'+(p.mine==="none")+'" data-a="vote" data-p="none">ไม่กำจัดใคร</button></div>'+(p.done?'<div class="okbox">✅ โหวตแล้ว (เปลี่ยนได้จนกว่าผู้ดำเนินเกมสรุป)</div>':"")+'</div>';
}
function hunterPanel(v){ const p=v.priv.prompt;
  if(!p) return '<div class="panel center"><h3>🎯 รอ '+esc(v.hunterWho||"")+' (นายพราน) เลือกเป้าหมาย</h3></div>';
  return '<div class="panel"><h3>'+esc(p.title)+'</h3><div class="hint">'+esc(p.hint)+'</div><div class="chips">'+p.pool.map(j=>'<button class="chip pick" data-a="shoot" data-p="'+j+'">'+esc(v.players[j].name)+'</button>').join("")+'</div><button class="btn block" data-a="shoot">ยิงขึ้นฟ้า</button></div>'; }

/* ---------- render + events ---------- */
function render(){
  const act=document.activeElement; if(act&&act.id==="gtxt"){ O.ui.txt=act.value; return; } if(act&&act.id==="chat") return;
  let html;
  if(O.phase==="entry"||O.phase==="connecting") html=vEntry();
  else if(O.view){ html=O.view.mod?vMod(O.view):vPlayer(O.view); }
  else if(O.lobby) html=O.role==="host"?modLobby():plLobby();
  else html='<div class="panel center">กำลังเชื่อมต่อ…</div>';
  const y=window.scrollY; $app.innerHTML=html; window.scrollTo(0,y);
}
$app.addEventListener("input",e=>{ const t=e.target; if(t.id==="nm") O.name=t.value; else if(t.id==="cd"){ O.joinCode=t.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,4); t.value=O.joinCode; } else if(t.id==="gtxt") O.ui.txt=t.value; });
$app.addEventListener("change",e=>{ const t=e.target.closest("[data-a]"); if(!t) return;
  if(t.dataset.a==="rev") toHost({t:"cmd",c:"settings",reveal:t.checked});
  if(t.dataset.a==="set") toHost({t:"cmd",c:"settings",[t.dataset.k]:+t.value}); });
$app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b||b.tagName==="SELECT"||b.type==="checkbox") return; const a=b.dataset.a, v=O.view, ui=O.ui;
  try{ switch(a){
    case "create": onCreate(); break; case "resume": onResume(); break; case "join": onJoin(); break; case "leave": leave(); break;
    case "copy": { const u=b.dataset.v; (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast("คัดลอกลิงก์แล้ว"),()=>toast("คัดลอกไม่ได้ ส่งรหัสห้อง "+O.code+" แทน")); break; }
    case "cnt": { const c=Object.assign({},O.lobby.settings.counts), k=b.dataset.k; c[k]=Math.max(0,Math.min(RM[k].max,(c[k]||0)+(+b.dataset.d))); if(!c[k]) delete c[k]; O.lobby.settings.counts=c; toHost({t:"cmd",c:"settings",counts:c}); render(); break; }
    case "auto": toHost({t:"cmd",c:"auto"}); break; case "start": toHost({t:"cmd",c:"start"}); break;
    case "cmd": toHost({t:"cmd",c:b.dataset.c}); break;
    case "zoom": zoomRole(b); break; case "ready": toHost({t:"ready"}); break; case "peek": ui.peek=!ui.peek; render(); break;
    case "tog": { const p=+b.dataset.p, pr=v.priv.prompt, i=ui.sel.indexOf(p); if(i>=0) ui.sel.splice(i,1); else { if(pr.n===1) ui.sel=[p]; else if(ui.sel.length<pr.n) ui.sel.push(p); } render(); break; }
    case "submit": { const pr=v.priv.prompt; if(pr.k==="witch") toHost({t:"act",a:{h:ui.h,x:ui.x}}); else toHost({t:"act",a:{t:ui.sel}}); break; }
    case "skip": toHost({t:"act",a:{t:[]}}); break;
    case "hx": { const k=b.dataset.key, p=+b.dataset.p; ui[k]=ui[k]===p?null:p; render(); break; }
    case "yn": toHost({t:"act",a:{y:b.dataset.y==="1"}}); break;
    case "gsend": { const el=document.getElementById("gtxt"); toHost({t:"act",a:{s:el?el.value:ui.txt}}); break; }
    case "chat": { const el=document.getElementById("chat"); if(el&&el.value.trim()){ toHost({t:"chat",s:el.value}); el.value=""; } break; }
    case "vote": toHost({t:"vote",v:b.dataset.p==="none"?"none":+b.dataset.p}); break;
    case "shoot": { const p=b.dataset.p; if(O.role==="host") toHost({t:"cmd",c:"shoot",v:p==null?null:+p}); else toHost({t:"shoot",v:p==null?null:+p}); break; }
  } }catch(err){ console.error(err); }
});
render();
</script></body></html>
